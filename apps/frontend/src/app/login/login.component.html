<div class="login-page">
  <!-- PrimeNG Card Component for the layout -->
  <p-card styleClass="login-page__card">
    
    <ng-template pTemplate="header">
      <div class="login-page__header">
        <i class="pi pi-bolt login-page__logo"></i>
        <h1 class="login-page__title">Super Dragon</h1>
        <p class="login-page__subtitle">Welcome back! Please enter your details.</p>
      </div>
    </ng-template>

    <!-- PrimeNG Message Component for Errors -->
    <p-message 
      *ngIf="errorMessage()" 
      severity="error" 
      styleClass="login-page__error-banner">
      {{ errorMessage() }}
    </p-message>

    <!-- Angular Reactive Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-page__form">
      
      <!-- PrimeNG FloatLabel for Email -->
      <p-floatlabel>
        <input 
          id="email" 
          type="text" 
          pInputText 
          formControlName="email" 
          class="login-page__input p-inputtext-lg w-full"
        />
        <label for="email">Email</label>
      </p-floatlabel>

      <!-- PrimeNG FloatLabel and Password component -->
      <p-floatlabel>
        <p-password 
          id="password" 
          formControlName="password" 
          [toggleMask]="true"
          [feedback]="false"
          styleClass="w-full"
          inputStyleClass="login-page__input p-inputtext-lg w-full">
        </p-password>
        <label for="password">Password</label>
      </p-floatlabel>

      <!-- PrimeNG Submit Button -->
      <p-button 
        type="submit" 
        [label]="isLoading() ? 'Signing In...' : 'Sign In'" 
        styleClass="login-page__submit-btn w-full p-button-lg"
        [disabled]="loginForm.invalid || isLoading()"
        [loading]="isLoading()">
      </p-button>
      
      <p class="login-page__footer-text">
        Don't have an account? <a href="#" class="login-page__link">Sign up here</a>
      </p>

    </form>
  </p-card>
</div>
